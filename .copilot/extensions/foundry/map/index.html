<!doctype html>
<!-- Inspect the actual run as a map of outputs and consumers. A trace isolates a branch,
     never a new run; navigation and evidence stay separate from scheduling. -->
<html lang="en">
<head>
	<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Foundry · Work graph</title>
	<link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./studio.css"><link rel="stylesheet" href="./run.css">
	<script type="module" src="./map/view.mjs"></script>
</head>
<body class="studio work-map">
<svg class="symbols" aria-hidden="true">
	<symbol id="branch" viewBox="0 0 24 24"><rect x="2" y="9" width="5" height="6" rx="1"/><rect x="16" y="2.5" width="6" height="6" rx="1"/><rect x="16" y="15.5" width="6" height="6" rx="1"/><path d="M7 12h2q3 0 3-3V8q0-2.5 4-2.5m-7 6.5q3 0 3 3v1q0 2.5 4 2.5"/></symbol>
	<symbol id="write" viewBox="0 0 24 24"><path d="m4 20 5-1 12-12-4-4L5 15zM14 6l4 4"/></symbol>
	<symbol id="inspect" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></symbol>
	<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></symbol>
	<symbol id="stop" viewBox="0 0 24 24"><path d="M8 3.5h8l4.5 4.5v8L16 20.5H8L3.5 16V8zM8.5 12h7"/></symbol>
	<symbol id="tick" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11"/></symbol>
	<symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="3"/></symbol>
	<symbol id="play" viewBox="0 0 24 24"><path d="m7 4 12 8-12 8z"/></symbol>
	<symbol id="refresh-icon" viewBox="0 0 20 20"><path d="M3 4v5h5m-4.5-1a6.5 6.5 0 1 1 .8 6.7"/></symbol>
	<symbol id="fit-icon" viewBox="0 0 20 20"><path d="M3 8V3h5m4 0h5v5m0 4v5h-5m-4 0H3v-5"/></symbol>
	<symbol id="locate-icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5.5"/><circle cx="10" cy="10" r="1.5"/><path d="M10 1v3m0 12v3M1 10h3m12 0h3"/></symbol>
</svg>
<header class="bar">
	<svg class="studio-mark" aria-hidden="true"><use href="#branch"/></svg><h1>Work graph</h1>
	<span class="divider"></span><code id="run"></code><span class="source" id="source"></span>
	<a class="explorer-link" href="./machine.html?from=run" title="Open the state explorer">State explorer<span aria-hidden="true"> ↗</span></a>
	<button id="refresh" class="tool" type="button" aria-label="Refresh run" title="Refresh run"><svg><use href="#refresh-icon"/></svg></button>
	<button id="toggle" class="tool" type="button" title="Toggle inspector" aria-label="Toggle inspector" aria-controls="rail" aria-expanded="true" disabled>
		<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2"/><path class="dock-right" d="M12 3v14"/><path class="dock-bottom" d="M2 12h16"/></svg>
	</button>
</header>
<p id="notice" role="status">Reading the run…</p>
<main id="workbench" class="workbench" hidden>
	<section class="map-area" aria-label="Work graph workspace">
		<div class="graph-bar">
			<label class="search"><svg class="icon" aria-hidden="true"><use href="#inspect"/></svg><input id="query" type="search" aria-label="Find assignments" placeholder="Find an assignment…" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
			<button id="chain" type="button" aria-pressed="false" title="Show only the selected assignment’s upstream and downstream paths"><svg class="icon" aria-hidden="true"><use href="#branch"/></svg>Trace selection</button>
		</div>
		<div class="plot" id="plot">
			<a class="skip" href="#rail">Skip to inspector</a>
			<svg id="diagram" tabindex="0" role="group" aria-label="Work dependencies. Arrows point from a producer to a consumer. Select an assignment to inspect it. Arrow keys pan; plus and minus zoom; zero fits the graph.">
				<defs>
					<marker id="dep-base" viewBox="0 0 9 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 9 4 0 8z"/></marker>
					<marker id="dep-accent" viewBox="0 0 9 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 9 4 0 8z"/></marker>
					<marker id="dep-stop" viewBox="0 0 9 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 9 4 0 8z"/></marker>
				</defs>
				<g id="world"></g>
			</svg>
			<div id="empty" hidden><h2></h2><p></p></div>
			<div class="camera-tools" role="group" aria-label="Graph navigation">
				<button id="smaller" class="tool zoom-step" aria-label="Zoom out" title="Zoom out (−)">−</button><output id="zoom" aria-label="Zoom level"></output>
				<button id="larger" class="tool zoom-step" aria-label="Zoom in" title="Zoom in (+)">+</button><span class="divider"></span>
				<button id="fit" class="tool" aria-label="Fit visible graph" title="Fit visible graph (0)"><svg><use href="#fit-icon"/></svg></button>
				<button id="locate" class="tool" aria-label="Locate selected assignment" title="Locate selected assignment"><svg><use href="#locate-icon"/></svg></button>
			</div>
			<svg id="overview" role="img" aria-label="Overview of the visible work graph"></svg>
		</div>
		<div class="graph-key"><span><i></i>Checked input</span><span><i class="pending"></i>Pending input</span><span id="flow"></span></div>
	</section>
	<aside class="inspector" id="rail" tabindex="-1" aria-label="Run inspector">
		<div class="tabs" role="tablist" aria-label="Work graph inspector">
			<button role="tab" id="tab-detail" aria-controls="detail" aria-selected="true">Assignment</button>
			<button role="tab" id="tab-find" aria-controls="find" aria-selected="false" tabindex="-1">Find</button>
			<button role="tab" id="tab-proof" aria-controls="proof" aria-selected="false" tabindex="-1">Run <span id="issues"></span></button>
		</div>
		<section class="work-pane" role="tabpanel" id="detail" aria-labelledby="tab-detail" tabindex="0"></section>
		<section class="work-pane" role="tabpanel" id="find" aria-labelledby="tab-find" tabindex="0" hidden>
			<h2>Assignments</h2><label class="filter-label">Status <select id="filter"><option value="">All statuses</option></select></label>
			<p id="matches" role="status"></p><div id="results"></div>
		</section>
		<section class="work-pane" role="tabpanel" id="proof" aria-labelledby="tab-proof" tabindex="0" hidden></section>
	</aside>
</main>
<footer class="statusline" aria-label="Run status">
	<span id="phase"></span>
	<ul id="activity" role="list" aria-label="Visible assignments by status"></ul>
	<span id="scope">Read only</span>
</footer>
<span id="announce" class="sr-only" aria-live="polite"></span>
</body></html>
