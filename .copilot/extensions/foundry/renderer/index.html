<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="foundry-token" content="__FOUNDRY_TOKEN__" />
    <meta name="foundry-plan-id" content="__FOUNDRY_PLAN_ID__" />
    <title>Foundry</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="toolbar">
      <div>
        <p class="eyebrow">Foundry engineering plan</p>
        <h1 id="plan-title">Loading…</h1>
        <p id="plan-objective" class="muted"></p>
      </div>
      <div class="toolbar-actions">
        <button id="refresh-button" type="button">Refresh</button>
        <button id="approve-button" type="button" hidden>Approve</button>
        <button id="cancel-plan-button" class="danger" type="button" hidden>Cancel plan</button>
      </div>
    </header>
    <main>
      <section id="summary" class="summary" aria-live="polite"></section>
      <section aria-labelledby="workflows-title">
	<h2 id="workflows-title">Native workflows</h2>
	<p class="muted">Pause or resume workflow agents without changing plan approvals or App task sessions.</p>
	<div id="workflows" class="panel">Loading workflow status...</div>
      </section>
      <section>
        <h2>Tasks</h2>
        <div id="tasks" class="task-groups"></div>
      </section>
      <section>
        <h2>Verification</h2>
        <div id="verification" class="panel"></div>
      </section>
      <section>
        <h2>Recovery</h2>
        <div id="recovery" class="panel"></div>
      </section>
      <section>
	<h2>Activity</h2>
	<div id="activity" class="panel"></div>
      </section>
      <p id="error" class="error" role="alert"></p>
    </main>
  </body>
</html>
